name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (unit + integration)
    runs-on: ubuntu-latest

    # 整合測試用的拋棄式 PostgreSQL（CI 提供 instance，harness 會透過 TEST_DATABASE_URL 使用它）
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fruit
          POSTGRES_PASSWORD: fruit
          POSTGRES_DB: fruit_sales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fruit -d fruit_sales_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci
        env:
          # 有此變數時 global-setup 直接用 service container，不啟動 Testcontainers
          TEST_DATABASE_URL: postgres://fruit:fruit@localhost:5432/fruit_sales_test
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

      - name: Coverage summary → job page
        if: always() # 即使測試失敗也把已產生的覆蓋率印到頁面
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "⚠️ 找不到 coverage-summary.json（測試可能在覆蓋率產出前失敗）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (label, m) => `| ${label} | ${m.pct}% | ${m.covered}/${m.total} |`;
            const md = [
              "## 🧪 測試覆蓋率",
              "",
              "| 指標 | 覆蓋率 | 覆蓋/總數 |",
              "|---|---|---|",
              row("Lines", t.lines),
              row("Statements", t.statements),
              row("Functions", t.functions),
              row("Branches", t.branches),
              "",
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

      - name: Upload test report
        if: always() # 測試失敗也要上傳報告
        uses: actions/upload-artifact@v6
        with:
          name: junit-test-report
          path: backend/test-results/junit.xml
          if-no-files-found: error

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: backend/coverage/
          if-no-files-found: warn
